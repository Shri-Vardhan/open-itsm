<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
        margin: 0;
        padding: 40px;
        background: #f4f6f9;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #2f3b52;
        text-align: center;
    }

    h1 {
        font-size: 26px;
        font-weight: 600;
        color: #1f2d3d;
        margin-bottom: 25px;
    }

    a {
        display: inline-block;
        background: #0066cc;
        color: white;
        text-decoration: none;
        padding: 10px 24px;
        border-radius: 3px;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s;
    }

    a:hover {
        background: #0052a3;
    }

    a:active {
        background: #004080;
    }
  </style>
</head>

<body>

<h1>Welcome To OpenITSM</h1>

<a href="/logout">
  Logout
</a>

</body>
</html>
